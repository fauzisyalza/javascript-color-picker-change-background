<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Color Picker | Fauzi Syalza</title>
</head>
<body>
    <div class="container">
        <div class="title">pilih warna</div>
        <div class="box">
            <div class="circle red"></div>
            <div class="circle blue"></div>
            <div class="circle green"></div>
            <div class="circle black"></div>
        </div>

        <div>
            <button class="tombol" onclick="resetWarna()">reset</button>
        </div>
    </div>
    <script>    
    const circles = document.querySelectorAll(".circle");  
    const title = document.querySelector(".title")
    circles.forEach(circle => {
        circle.addEventListener("click", ({target}) => {
            const {backgroundColor} = getComputedStyle (target);
            document.body.style.backgroundColor = backgroundColor;

        if (target.classList.contains("black")) {
            title.style.color = "white";
        } else {
            title.style.color = "black";
        }
        });
    });

    function resetWarna() {
        document.body.style.backgroundColor = "white";
        title.style.color = "black";
    }

    </script>
</body>
</html>
